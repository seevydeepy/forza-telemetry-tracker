name: Desktop Package Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in the unsigned diagnostic package, without a leading v."
        required: true
        type: string
      channel:
        description: "Release channel metadata to embed."
        required: false
        default: "stable"
        type: string
      feedback_endpoint:
        description: "Feedback endpoint metadata to embed."
        required: false
        default: "https://forza-telemetry-feedback.cvdp.workers.dev/v1/reports"
        type: string

permissions:
  contents: read

env:
  # Opt into GitHub's upcoming Node 24 JavaScript action runtime before it becomes the default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build unsigned Windows desktop package
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Validate version input
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim().TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version must look like X.Y.Z or X.Y.Z-suffix. Got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_date=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" >> $env:GITHUB_OUTPUT

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-telemetry-tracker.txt
            requirements-telemetry-test.txt
            requirements-telemetry-desktop.txt
            requirements-telemetry-release-lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/telemetry-tracker/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download WebView2 standalone installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "build\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"

      - name: Build unsigned desktop package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools\build-desktop-release.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Repository "${{ github.repository }}" `
            -Channel "${{ inputs.channel }}" `
            -ReleaseDate "${{ steps.version.outputs.release_date }}" `
            -GitSha "${{ github.sha }}" `
            -FeedbackEndpoint "${{ inputs.feedback_endpoint }}" `
            -WebView2StandaloneInstaller "$((Resolve-Path build\MicrosoftEdgeWebView2RuntimeInstallerX64.exe).Path)"

      - name: Create diagnostic package checksum
        id: assets
        shell: pwsh
        run: |
          $installer = "dist\installer\ForzaTelemetryTrackerSetup-v${{ steps.version.outputs.version }}-x64.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$installer.sha256"
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -Path $checksum -Encoding ascii
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Upload diagnostic package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-desktop-package-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.checksum }}
          if-no-files-found: error
